name: CI Pipeline - Vue Todo App

on:
  push:
    branches:
      - development

jobs:
  build:
    name: Install & Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Confirm build output
        run: |
          echo "Build completed successfully."
          ls dist/
